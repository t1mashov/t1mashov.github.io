<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HelpDeskEddy Notifications</title>
<meta name="apple-mobile-web-app-title" content="HelpDeskEddy Notifications" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
<link rel="icon" href="assets/icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2c9b75" />
<script>
  // Клик по уведомлению открывает страницу с ?redirect=<путь>, и уже она уходит на helpdeskeddy:// — из service worker iOS не передаёт управление приложению.
  (function () {
    // Передаёт управление приложению: открывает его по ссылке helpdeskeddy://open с путём тикета.
    function openApp(path) {
      window.location.href = "helpdeskeddy://open?path=" + encodeURIComponent(path);
    }

    // Экран «Открытие приложения…» только при открытии по клику на уведомление; при уходе PWA в фон снимаем, иначе при ручном открытии останется спиннер.
    function showOpening() {
      var root = document.documentElement;
      root.classList.add("redirecting");
      function reset() {
        if (document.visibilityState === "hidden") {
          root.classList.remove("redirecting");
          document.removeEventListener("visibilitychange", reset);
        }
      }
      document.addEventListener("visibilitychange", reset);
    }

    // Страницу открыл воркер (PWA была закрыта): путь тикета лежит в ?redirect=.
    const redirect = new URLSearchParams(window.location.search).get("redirect");
    if (redirect) {
      showOpening();
      // Убираем ?redirect= из адреса, чтобы повторная загрузка не увела в приложение снова.
      history.replaceState(null, "", window.location.pathname);
      // Ждём отрисовки: редирект прямо из <head> обрывает разбор документа и даёт белый экран.
      document.addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(function () {
          openApp(redirect);
        });
      });
    }

    // Открытую PWA воркер не перезагружает, а присылает путь сообщением — уходим в приложение отсюда.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.addEventListener("message", function (event) {
        if (event.data && event.data.pushUrl) {
          showOpening();
          requestAnimationFrame(function () {
            openApp(event.data.pushUrl);
          });
        }
      });
    }
  })();
</script>
<style>
  :root {
    --primary: #23869b;
    --primary-light: #65aab9;
    --border: #dcdfe6;
    --text: #303133;
    --muted: #909399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html {
    background-color: #23879a;
    background-image: linear-gradient(to right, #2c9b75 0%, #23879a 100%);
  }
  /* Градиент отдельным слоем: background-attachment: fixed на iOS не работает, и внизу оставалась белая полоса. */
  body::before {
    content: "";
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: -1;
    /* Низ плавно уходит в сплошной #23879a: в портрете iOS не растягивает страницу под индикатор «Домой», и эту полосу красит сплошной цвет html. */
    background:
      linear-gradient(to bottom, rgba(35, 135, 154, 0) 0, rgba(35, 135, 154, 0) calc(100% - 120px), #23879a 100%),
      linear-gradient(to right, #2c9b75 0%, #23879a 100%);
  }
  body {
    font-family: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", Arial, sans-serif;
    color: var(--text);
    background: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .logo { width: 100%; max-width: 350px; height: auto; display: block; }

  .card {
    width: 100%;
    max-width: 350px;
    background: #fff;
    border-radius: 3px;
    padding: 20px;
    font-size: 14px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .3);
  }
  .card__header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 20px;
    padding-bottom: 16px;
  }
  .card__header svg { width: 18px; height: 18px; flex: none; }
  .card__hint { margin: 0 0 16px; line-height: 1.5; color: #606266; text-align: center; }

  .btn {
    display: block;
    width: 100%;
    height: 40px;
    padding: 0 19px;
    border: 1px solid var(--primary);
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn:hover, .btn:active { background: var(--primary-light); border-color: var(--primary-light); }
  .btn:disabled { background: #a8d0da; border-color: #a8d0da; cursor: not-allowed; }

  .enabled-msg {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    border-radius: 4px;
    background: #f0f9eb;
    color: #67c23a;
    font-size: 14px;
  }
  .enabled-msg svg { width: 16px; height: 16px; flex: none; }

  .banner {
    display: none;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    background: #fdf6ec;
    color: #b88230;
    line-height: 1.5;
    font-size: 13px;
  }
  .status:empty { display: none; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    background: #f4f4f5;
    color: #606266;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .opening {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: #fff;
    font-size: 18px;
    text-align: center;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(255, 255, 255, .35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .redirecting .card { display: none; }
  .redirecting .opening { display: flex; }
</style>
</head>
<body>

<main class="page">
  <img class="logo" src="assets/login-page-logo.svg" alt="HelpDeskEddy" />

  <section class="card">
    <div class="card__header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Уведомления
    </div>
    <p class="card__hint">Включите push-уведомления, чтобы получать оповещения HelpDeskEddy прямо в приложении.</p>

    <div id="banner" class="banner"></div>
    <button id="enableBtn" class="btn">Включить уведомления</button>
    <div id="enabledMsg" class="enabled-msg" role="status" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Уведомления уже включены
    </div>
    <a id="resendLink" href="#" style="display: none; margin-top: 12px; text-align: center; font-size: 12px; color: var(--primary);">Обновить данные</a>
    <div id="status" class="status" role="status"></div>
  </section>

  <div class="opening" role="status">
    <div class="spinner"></div>
    <div class="opening__text">Открытие приложения…</div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

  // Поля Firebase-проекта, без которых токен не получить.
  const REQUIRED_FIELDS = ["apiKey", "projectId", "appId", "messagingSenderId", "vapidKey"];

  const statusEl = document.getElementById("status");
  const bannerEl = document.getElementById("banner");
  const btn = document.getElementById("enableBtn");
  const enabledMsgEl = document.getElementById("enabledMsg");
  const resendEl = document.getElementById("resendLink");

  // Показывает текущий шаг под кнопкой.
  function log(text) {
    statusEl.textContent = text;
  }

  // Показывает предупреждение и блокирует кнопку.
  function showBanner(text) {
    bannerEl.style.display = "block";
    bannerEl.textContent = text;
    btn.disabled = true;
  }

  // Определяет iPhone/iPad: ограничение с установкой на «Домой» действует только там.
  function isIos() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  // Страница запущена с экрана «Домой», а не из вкладки Safari.
  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  // Читает config.json и проверяет поля Firebase; без них токен получить нельзя, поэтому иначе показываем ошибку.
  async function loadConfig() {
    // config.json лежит рядом со страницей и правится вручную; значения не секретны (публичные Firebase Web-идентификаторы)
    let cfg;
    try {
      const resp = await fetch("./config.json", { cache: "no-store" });
      if (!resp.ok) {
        throw new Error("HTTP " + resp.status);
      }
      cfg = await resp.json();
    } catch (e) {
      showBanner("Не удалось загрузить config.json: " + (e && e.message ? e.message : String(e)) + ". См. README.md.");
      btn.style.display = "none";
      return null;
    }

    const missing = REQUIRED_FIELDS.filter((key) => !cfg[key]);
    if (missing.length > 0) {
      showBanner("В config.json не заполнены поля: " + missing.join(", ") + ". Откуда их взять — см. README.md.");
      btn.style.display = "none";
      return null;
    }

    return cfg;
  }

  // Точка входа: конфиг → Firebase → проверка установки на «Домой» → состояние карточки и подписка.
  async function main() {
    const cfg = await loadConfig();
    if (!cfg) {
      return;
    }

    // Инициализируем Firebase проектом клиента: токен должен быть выдан тем же проектом, через который HDE шлёт push.
    const firebaseConfig = {
      apiKey: cfg.apiKey,
      authDomain: cfg.authDomain || cfg.projectId + ".firebaseapp.com",
      projectId: cfg.projectId,
      messagingSenderId: String(cfg.messagingSenderId),
      appId: cfg.appId
    };
    const VAPID_KEY = cfg.vapidKey;
    const app = initializeApp(firebaseConfig);

    // На iPhone push работает только у страницы, установленной на «Домой», иначе просим установить и дальше не идём.
    if (isIos() && !isStandalone()) {
      showBanner("Чтобы уведомления работали на iPhone — сначала добавьте эту страницу на экран «Домой» (кнопка «Поделиться» → «На экран Домой»), затем откройте её оттуда.");
      return;
    }

    // Карточка всегда показывает одно из двух: кнопку включения или «уже включены».
    function updateState() {
      const enabled = Notification.permission === "granted";
      btn.style.display = enabled ? "none" : "";
      enabledMsgEl.style.display = enabled ? "flex" : "none";
      resendEl.style.display = enabled ? "block" : "none";
    }
    updateState();
    // PWA живёт в фоне, поэтому состояние и статус обновляем при каждом возвращении на страницу.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        log("");
        updateState();
      }
    });

    // Просит разрешение (если не выдано), берёт токен и передаёт его в приложение; вызывается кнопкой и ссылкой «Обновить данные».
    async function enableAndHandOff() {
      try {
        // Разрешение на уведомления: без него iOS не выдаёт токен.
        log("Запрашиваем разрешение...");
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          log("Разрешение не выдано: " + permission);
          return;
        }

        // Регистрируем воркер, который будет принимать push, и ждём его активации.
        log("Регистрируем service worker...");
        const registration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
        await navigator.serviceWorker.ready;

        // Просим у Firebase токен для этого устройства; воркер нужен, чтобы токен был привязан к его push-подписке.
        log("Получаем токен...");
        const messaging = getMessaging(app);
        const token = await getToken(messaging, {
          vapidKey: VAPID_KEY,
          serviceWorkerRegistration: registration
        });

        if (!token) {
          log("Токен не получен (пусто).");
          return;
        }

        // Передаём токен приложению по ссылке helpdeskeddy://webpush-token: оно отправит его в HDE.
        log("");
        updateState();
        window.location.href = "helpdeskeddy://webpush-token?value=" + encodeURIComponent(token);
      } catch (e) {
        log("Ошибка: " + (e && e.message ? e.message : String(e)));
        console.error(e);
      }
    }

    // Кнопка и ссылка «Обновить данные» запускают один и тот же процесс.
    btn.addEventListener("click", enableAndHandOff);
    document.getElementById("resendLink").addEventListener("click", (event) => {
      event.preventDefault();
      enableAndHandOff();
    });
  }

  main();
</script>
</body>
</html>
