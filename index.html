<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HDE Push</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<style>
  body { font-family: -apple-system, sans-serif; padding: 24px; max-width: 480px; margin: 0 auto; }
  button { font-size: 17px; padding: 12px 20px; border-radius: 10px; border: none; background: #007aff; color: white; width: 100%; }
  button:disabled { background: #ccc; }
  #status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #f2f2f7; font-size: 14px; white-space: pre-wrap; word-break: break-all; }
  #banner { display: none; margin-bottom: 16px; padding: 12px; border-radius: 8px; background: #fff3cd; font-size: 14px; }
</style>
</head>
<body>

<h2>HDE — уведомления</h2>

<div id="banner"></div>
<button id="enableBtn">Включить уведомления</button>
<div id="status">Готово к запуску теста.</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3MVD9ief0JprMRC3Atbd7dPt1gmH4SKU",
    authDomain: "hdepush.firebaseapp.com",
    projectId: "hdepush",
    storageBucket: "hdepush.firebasestorage.app",
    messagingSenderId: "647887531816",
    appId: "1:647887531816:web:795292b474ff5e66a46a1d"
  };

  const VAPID_KEY = "BONBi8yYV3zdUx8aWRh-gA-jFO8bTALBmg7DF0kNyci12-tZCggLvKe1RUxtifpkR137ULKaoqGtimK6qKrvEdE";

  const app = initializeApp(firebaseConfig);
  const statusEl = document.getElementById("status");
  const bannerEl = document.getElementById("banner");
  const btn = document.getElementById("enableBtn");

  function log(text) {
    statusEl.textContent = text;
    console.log(text);
  }

  function isIos() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  if (isIos() && !isStandalone()) {
    bannerEl.style.display = "block";
    bannerEl.textContent = "Чтобы уведомления работали на iPhone — сначала добавьте эту страницу на экран «Домой» (кнопка «Поделиться» → «На экран Домой»), затем откройте её оттуда.";
    btn.disabled = true;
  }

  btn.addEventListener("click", async () => {
    try {
      log("Запрашиваем разрешение...");
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        log("Разрешение не выдано: " + permission);
        return;
      }

      log("Регистрируем service worker...");
      const registration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      await navigator.serviceWorker.ready;

      log("Получаем токен...");
      const messaging = getMessaging(app);
      const token = await getToken(messaging, {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: registration
      });

      if (!token) {
        log("Токен не получен (пусто).");
        return;
      }

      log("Токен получен, скопируйте для теста:\n\n" + token);
    } catch (e) {
      log("Ошибка: " + (e && e.message ? e.message : String(e)));
      console.error(e);
    }
  });
</script>
</body>
</html>
