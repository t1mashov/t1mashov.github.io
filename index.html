<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HelpDeskEddy Notifications</title>
<meta name="apple-mobile-web-app-title" content="HelpDeskEddy Notifications" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon.ico" type="image/x-icon" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#2c9b75" />
<script>
  // Клик по пуш-уведомлению открывает эту страницу с ?redirect=<путь> (см.
  // firebase-messaging-sw.js). Тут же, из реально загруженной страницы (а не из
  // service worker), уходим на кастомную схему — так iOS надёжно передаёт
  // управление приложению. Пока идёт переход, показываем только логотип и
  // спиннер (без карточки), чтобы не мигал интерфейс.
  (function () {
    const redirect = new URLSearchParams(window.location.search).get("redirect");
    if (redirect) {
      document.documentElement.classList.add("redirecting");
      // Переходим только когда страница уже отрисована: редирект прямо из <head>
      // обрывает разбор документа, и на долю секунды виден белый экран.
      document.addEventListener("DOMContentLoaded", function () {
        requestAnimationFrame(function () {
          window.location.href = "helpdeskeddy://open?path=" + encodeURIComponent(redirect);
        });
      });
    }
  })();
</script>
<style>
  :root {
    --primary: #23869b;
    --primary-light: #65aab9;
    --border: #dcdfe6;
    --text: #303133;
    --muted: #909399;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html {
    background-color: #23879a;
    background-image: linear-gradient(to right, #2c9b75 0%, #23879a 100%);
  }
  /* Градиент на отдельном слое во весь экран: background-attachment: fixed на iOS не
     работает, и внизу (под индикатором «Домой») оставалась белая полоса. */
  body::before {
    content: "";
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: -1;
    /* Нижний край плавно уходит в сплошной #23879a: в портрете iOS не растягивает
       страницу под индикатор «Домой», и эту полосу закрашивает цвет фона html —
       сплошной, а не градиентный. Так граница с ней не видна. */
    background:
      linear-gradient(to bottom, rgba(35, 135, 154, 0) 0, rgba(35, 135, 154, 0) calc(100% - 120px), #23879a 100%),
      linear-gradient(to right, #2c9b75 0%, #23879a 100%);
  }
  body {
    font-family: "Helvetica Neue", Helvetica, -apple-system, "PingFang SC", Arial, sans-serif;
    color: var(--text);
    background: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
  }
  .logo { width: 100%; max-width: 350px; height: auto; display: block; }

  .card {
    width: 100%;
    max-width: 350px;
    background: #fff;
    border-radius: 3px;
    padding: 20px;
    font-size: 14px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .3);
  }
  .card__header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 20px;
    padding-bottom: 16px;
  }
  .card__header svg { width: 18px; height: 18px; flex: none; }
  .card__hint { margin: 0 0 16px; line-height: 1.5; color: #606266; text-align: center; }

  .btn {
    display: block;
    width: 100%;
    height: 40px;
    padding: 0 19px;
    border: 1px solid var(--primary);
    border-radius: 4px;
    background: var(--primary);
    color: #fff;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  .btn:hover, .btn:active { background: var(--primary-light); border-color: var(--primary-light); }
  .btn:disabled { background: #a8d0da; border-color: #a8d0da; cursor: not-allowed; }

  .enabled-msg {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    border-radius: 4px;
    background: #f0f9eb;
    color: #67c23a;
    font-size: 14px;
  }
  .enabled-msg svg { width: 16px; height: 16px; flex: none; }

  .banner {
    display: none;
    margin-bottom: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    background: #fdf6ec;
    color: #b88230;
    line-height: 1.5;
    font-size: 13px;
  }
  .status:empty { display: none; }
  .status {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 4px;
    background: #f4f4f5;
    color: #606266;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .opening {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    color: #fff;
    font-size: 18px;
    text-align: center;
  }
  .spinner {
    width: 44px; height: 44px;
    border: 4px solid rgba(255, 255, 255, .35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .redirecting .card { display: none; }
  .redirecting .opening { display: flex; }
</style>
</head>
<body>

<main class="page">
  <img class="logo" src="login-page-logo.svg" alt="HelpDeskEddy" />

  <section class="card">
    <div class="card__header">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Уведомления
    </div>
    <p class="card__hint">Включите push-уведомления, чтобы получать оповещения HelpDeskEddy прямо в приложении.</p>

    <div id="banner" class="banner"></div>
    <button id="enableBtn" class="btn">Включить уведомления</button>
    <div id="enabledMsg" class="enabled-msg" role="status" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      Уведомления уже включены
    </div>
    <div id="status" class="status" role="status"></div>
  </section>

  <div class="opening" role="status">
    <div class="spinner"></div>
    <div class="opening__text">Открытие приложения…</div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-messaging.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3MVD9ief0JprMRC3Atbd7dPt1gmH4SKU",
    authDomain: "hdepush.firebaseapp.com",
    projectId: "hdepush",
    storageBucket: "hdepush.firebasestorage.app",
    messagingSenderId: "647887531816",
    appId: "1:647887531816:web:795292b474ff5e66a46a1d"
  };

  const VAPID_KEY = "BONBi8yYV3zdUx8aWRh-gA-jFO8bTALBmg7DF0kNyci12-tZCggLvKe1RUxtifpkR137ULKaoqGtimK6qKrvEdE";

  const app = initializeApp(firebaseConfig);
  const statusEl = document.getElementById("status");
  const bannerEl = document.getElementById("banner");
  const btn = document.getElementById("enableBtn");
  const enabledMsgEl = document.getElementById("enabledMsg");

  function log(text) {
    statusEl.textContent = text;
  }

  function isIos() {
    return /iphone|ipad|ipod/i.test(navigator.userAgent);
  }

  function isStandalone() {
    return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  }

  if (isIos() && !isStandalone()) {
    bannerEl.style.display = "block";
    bannerEl.textContent = "Чтобы уведомления работали на iPhone — сначала добавьте эту страницу на экран «Домой» (кнопка «Поделиться» → «На экран Домой»), затем откройте её оттуда.";
    btn.disabled = true;
  } else if (Notification.permission === "granted") {
    // Разрешение уже выдано раньше — повторное нажатие ничего не сломает (getToken()
    // просто вернёт тот же токен), но и смысла в нём нет, поэтому просто показываем
    // текущее состояние вместо кнопки.
    btn.style.display = "none";
    enabledMsgEl.style.display = "flex";
  }

  btn.addEventListener("click", async () => {
    try {
      log("Запрашиваем разрешение...");
      const permission = await Notification.requestPermission();
      if (permission !== "granted") {
        log("Разрешение не выдано: " + permission);
        return;
      }

      log("Регистрируем service worker...");
      const registration = await navigator.serviceWorker.register("firebase-messaging-sw.js");
      await navigator.serviceWorker.ready;

      log("Получаем токен...");
      const messaging = getMessaging(app);
      const token = await getToken(messaging, {
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: registration
      });

      if (!token) {
        log("Токен не получен (пусто).");
        return;
      }

      log("Токен получен, возвращаемся в приложение...");
      window.location.href = "helpdeskeddy://webpush-token?value=" + encodeURIComponent(token);
    } catch (e) {
      log("Ошибка: " + (e && e.message ? e.message : String(e)));
      console.error(e);
    }
  });
</script>
</body>
</html>
